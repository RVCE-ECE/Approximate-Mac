project:
  title: "Configurable Approximate MAC"
  author: "shrilakshmi"
  description: "A signed INT8 configurable approximate multiply-accumulate architecture"
  language: "SystemVerilog"
  clock_hz: 10000000

pinout:
  ui[0]: "Operand A bit 0"
  ui[1]: "Operand A bit 1"
  ui[2]: "Operand A bit 2"
  ui[3]: "Operand A bit 3"
  ui[4]: "Operand A bit 4"
  ui[5]: "Operand A bit 5"
  ui[6]: "Operand A bit 6"
  ui[7]: "Operand A bit 7"

  uo[0]: "Accumulator bit 0"
  uo[1]: "Accumulator bit 1"
  uo[2]: "Accumulator bit 2"
  uo[3]: "Accumulator bit 3"
  uo[4]: "Accumulator bit 4"
  uo[5]: "Accumulator bit 5"
  uo[6]: "Accumulator bit 6"
  uo[7]: "Accumulator bit 7"

  uio[0]: "Operand B bit 0"
  uio[1]: "Operand B bit 1"
  uio[2]: "Operand B bit 2"
  uio[3]: "Operand B bit 3"
  uio[4]: "Operand B bit 4"
  uio[5]: "Operand B bit 5"
  uio[6]: "Operand B bit 6"
  uio[7]: "Operand B bit 7"
